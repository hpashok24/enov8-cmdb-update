name: 'Enov8 - User Validated Deployment Update'
description: 'Update or create Enov8 CMDB resource versions, validating the user exists and has access to the System first.'
author: 'Enov8 Ltd'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  userid:
    description: 'REQUIRED. Enov8 User ID the request is made on behalf of. The user must exist in the Enov8 Ecosystem with an active User Status and Login Access set to Yes. For Environment Instance and MicroService (create and update), the user must also be a member of the Assigned To group of the associated System.'
    required: true

  resourceType:
    description: 'Supported values: Environment Instance | System Component | System Interface | MicroService'
    required: true

  resourceName:
    description: 'Exact name of the Enov8 resource to update'
    required: true

  systemInstance:
    description: 'Required when resourceType is MicroService'
    required: false

  version:
    description: 'Version value to update'
    required: true

  autocreate:
    description: 'Boolean. When true, create resourceName if it does not already exist (using metadata). When false (default), a not-found resourceName is always an error.'
    required: false
    default: 'false'

  metadata:
    description: 'Used when autocreate is true and resourceName does not exist yet. For Environment Instance/System Interface/MicroService: "Status" (default "InOperation"), "System", "Environment", "Business Unit" (default "Other"), "Type" (default "Other"), "Core" (default "False"), "Resource ID" (optional, e.g. an APM ID). The System is found by "Resource ID" first, then by "System" name; if neither matches, it is created with those values. Example: {"System": "GDW", "Environment": "DEV Env", "Resource ID": "APM-12345"}. For System Component: "Status" (default "InOperation"), "Type" (REQUIRED, e.g. Server, Database), "Monitored" (default "False"). "Assigned To" and "Organisation" are always resolved automatically and must not be supplied.'
    required: false

  app_id:
    description: 'Enov8 App ID'
    required: true

  app_key:
    description: 'Enov8 App Key'
    required: true

  enov8_url:
    description: 'Base URL of your Enov8 instance (Example: https://yourcompany.enov8.cloud/ecosystem)'
    required: true

outputs:
  result:
    description: 'JSON response returned by the Enov8 API'

runs:
  using: 'node24'
  main: 'dist/index.js'

name: 'Enov8 - Deployment Version Update'
description: 'Update (or create) Enov8 CMDB resources (Environment Instance, System Component, System Interface, MicroService) version via GitHub Actions.'
author: 'hpashok24'

branding:
  icon: 'layers'
  color: 'green'

inputs:
  resourceType:
    description: 'Supported values: Environment Instance | System Component | System Interface | MicroService'
    required: true

  resourceName:
    description: 'Exact name of the Enov8 resource to update'
    required: true

  systemInstance:
    description: 'Required when resourceType is MicroService'
    required: false

  version:
    description: 'Optional version value to update'
    required: false

  autocreate:
    description: 'Boolean. When true, create resourceName if it does not already exist (using metadata). When false (default), a not-found resourceName is always an error. Can be written unquoted (true/false) in the workflow YAML.'
    required: false
    default: 'false'

  metadata:
    description: 'Used when autocreate is true and resourceName does not exist yet. Supported keys: "Status" (default "InOperation"), "System", "Environment", "Business Unit" (default "Other"), "Type" (default "Other"), "Core" (default "False"). "System"/"Environment" are by name — resolved to ECO IDs automatically. "Business Unit", "Type", and "Core" are only used if "System" also does not exist and must be created — Type must be a value already configured in your Enov8 tenant (e.g. Other, Cloud, Azure, AWS, GCP, Windows, Linux, Mainframe, Non-Mainframe, Middleware, Container, Interface, MicroService, Legacy, PC Client Server). "Assigned To" and "Organisation" are always resolved automatically (Assigned To = the Group flagged "Env Management"; Organisation = the tenant single Organisation) and must not be supplied. Example (all defaults): {"System": "GDW", "Environment": "DEV Env"}'
    required: false

  app_id:
    description: 'Enov8 App ID'
    required: true

  app_key:
    description: 'Enov8 App Key'
    required: true

  enov8_url:
    description: 'Base URL of your Enov8 instance (Example: https://yourcompany.enov8.cloud/ecosystem)'
    required: true

  insecure_skip_tls_verify:
    description: 'Set to true to skip TLS verification (not recommended)'
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'

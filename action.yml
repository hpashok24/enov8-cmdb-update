name: 'Enov8 - Governed Deployment Version Update'
description: 'Update or create Enov8 CMDB resource versions as the GitHub user who ran the workflow, with Enov8 access checks.'
author: 'Enov8 Ltd'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  resourceType:
    description: 'Supported values: Environment Instance | System Component | System Interface | MicroService'
    required: true

  resourceName:
    description: 'Exact name of the Enov8 resource to update'
    required: true

  systemInstance:
    description: 'Required when resourceType is MicroService'
    required: false

  version:
    description: 'Version value to update'
    required: true

  autocreate:
    description: 'Boolean. When true, create resourceName if it does not already exist (using metadata). When false (default), a not-found resourceName is always an error. Can be written unquoted (true/false) in the workflow YAML.'
    required: false
    default: 'false'

  metadata:
    description: 'Used when autocreate is true and resourceName does not exist yet. For Environment Instance/System Interface/MicroService: "Status" (default "InOperation"), "System", "Environment", "Business Unit" (default "Other"), "Type" (default "Other"), "Core" (default "False"), "Resource ID" (optional, e.g. an APM ID, saved to the System''s Resource ID field) — "System"/"Environment" resolved by name automatically; "Business Unit"/"Type"/"Core"/"Resource ID" only used if "System" also needs creating, Type must be a value configured in your tenant System Type picklist (e.g. Other, Cloud, Azure, AWS, GCP, Windows, Linux, Mainframe, Non-Mainframe, Middleware, Container, Interface, MicroService, Legacy, PC Client Server). Example: {"System": "GDW", "Environment": "DEV Env"}. The System is found by "Resource ID" first, then by "System" name; the same System is used for the access check. Optional System links (Environment Instance and MicroService, on create and update): "Upstream" and "Downstream", each a list of {"Resource ID": "<APM ID of the other System>", "ConnectionTechnology": "<Enov8 Connection Type>"}; Upstream links this System as SOURCE, Downstream as TARGET; every entry needs both keys and an existing Resource ID; existing links are skipped. When resourceType is MicroService, this cascade-creates systemInstance (and its System) before the MicroService. For System Component (no System/Environment dependency): "Status" (default "InOperation"), "Type" (REQUIRED, no default — a separate tenant-specific Component Type picklist, e.g. Server, Database, Module, Integration), "Monitored" (default "False"). "Core" and "Monitored" accept true/false as JSON booleans or strings. Example: {"Type": "Server"}. In all cases, "Assigned To" and "Organisation" are always resolved automatically and must not be supplied.'
    required: false

  app_id:
    description: 'Enov8 App ID'
    required: true

  app_key:
    description: 'Enov8 App Key'
    required: true

  enov8_url:
    description: 'Base URL of your Enov8 instance (Example: https://yourcompany.enov8.cloud/ecosystem). Use https://; http:// is accepted only for trusted internal networks and sends credentials unencrypted.'
    required: true

  insecure_skip_tls_verify:
    description: 'Set to true to skip TLS certificate verification. Only for on-prem Enov8 instances with self-signed certificates (not recommended otherwise).'
    required: false
    default: 'false'

outputs:
  result:
    description: 'Raw JSON response from the Enov8 API for the target resource.'
  created:
    description: '"true" if this run created the target resource, "false" if it updated it (or it was already up to date).'
  resource-id:
    description: 'Enov8 ID (ECO-...) of the target resource.'
  previous-version:
    description: 'The Version the resource held before this run. Empty if it was just created or had no version.'

runs:
  using: 'node24'
  main: 'dist/index.js'

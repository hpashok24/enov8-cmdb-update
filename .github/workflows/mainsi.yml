name: Test Resource ID

on:
  workflow_dispatch:

jobs:
  update-microservice:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enov8 - Deployment Version Update
        uses: ./
        with:
          enov8_url: ${{ secrets.ENOV8_BASE_URL }}
          app_id: ${{ secrets.ENOV8_APP_ID }}
          app_key: ${{ secrets.ENOV8_APP_KEY }}
          resourceType: "MicroService"
          resourceName: "Payments Service"
          systemInstance: "PayHub (DEV)"
          version: "1.0.0"
          autocreate: true
          metadata: |
            {
              "System": "PayHub",
              "Environment": "DEV Env",
              "Business Unit": "Finance",
              "Type": "Cloud",
              "Core": "True",
              "Resource ID": "APM-10045"
            }

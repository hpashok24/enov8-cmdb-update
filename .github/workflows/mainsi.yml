name: Enov8 CMDB Update

on:
  workflow_dispatch:

jobs:
  update-microservice:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Enov8 - Deployment Version Update
        uses: enov8-Ltd/enov8-cmdb-onboarding@main
        with:
          enov8_url: ${{ secrets.ENOV8_BASE_URL }}
          app_id: ${{ secrets.ENOV8_APP_ID }}
          app_key: ${{ secrets.ENOV8_APP_KEY }}
          resourceType: "MicroService"
          resourceName: "Notification Service"
          systemInstance: "NovaLink (DEV)"
          version: "2.3.1"
          autocreate: true
          metadata: |
            {
              "System": "NovaLink",
              "Environment": "DEV Env",
              "Business Unit": "Finance",
              "Type": "Cloud",
              "Core": "False",
              "Resource ID": "APM-33902"
            }

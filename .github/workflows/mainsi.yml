name: Enov8 CMDB Update

on:
  workflow_dispatch:

jobs:
  update-cmdb:
    runs-on: ubuntu-latest

    environment: dev

    steps:
      - name: Enov8 - Deployment Version Update
        uses: hpashok24/enov8-cmdb-update@main
        with:
          enov8_url: ${{ secrets.ENOV8_BASE_URL }}
          app_id: ${{ secrets.ENOV8_APP_ID }}
          app_key: ${{ secrets.ENOV8_APP_KEY }}

          resourceType: "MicroService"
          resourceName: "TestMicroService1"
          systemInstance: "TestSystemInstance1 (SIT)"
          version: "1.0.0"
          autocreate: true

          metadata: |
            {
              "System": "TestSystem1",
              "Environment": "SIT Env",
              "Business Unit": "IT",
              "Type": "Cloud",
              "Core": "True"
            }

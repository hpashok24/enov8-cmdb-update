          STEP_OUTCOME_tc4_3: ${{ steps.tc4_3.outcome }}
          STEP_OUTCOME_tc5_1: ${{ steps.tc5_1.outcome }}
          STEP_OUTCOME_tc5_2: ${{ steps.tc5_2.outcome }}
          STEP_OUTCOME_tc5_3: ${{ steps.tc5_3.outcome }}
          STEP_OUTCOME_tc6_4: ${{ steps.tc6_4.outcome }}
          STEP_OUTCOME_tc8_1: ${{ steps.tc8_1.outcome }}
          STEP_OUTCOME_tc8_2: ${{ steps.tc8_2.outcome }}
          STEP_OUTCOME_tc9_1: ${{ steps.tc9_1.outcome }}
          STEP_OUTCOME_tc9_2: ${{ steps.tc9_2.outcome }}
          STEP_OUTCOME_tc9_3: ${{ steps.tc9_3.outcome }}
          STEP_OUTCOME_tc9_4: ${{ steps.tc9_4.outcome }}
          STEP_OUTCOME_tc9_5: ${{ steps.tc9_5.outcome }}
          STEP_OUTCOME_tc9_6: ${{ steps.tc9_6.outcome }}
          STEP_OUTCOME_tc10_1: ${{ steps.tc10_1.outcome }}
          STEP_OUTCOME_tc10_2: ${{ steps.tc10_2.outcome }}

name: Test System Interface

# Runs as the GitHub user who clicks "Run workflow" (must match an Enov8 User ID).
on:
  workflow_dispatch:

jobs:
  test-interface:
    runs-on: ubuntu-latest
    environment: dev

    env:
      RUN: ${{ github.run_id }}
      # An interface that already exists in Enov8 (find one with GET {{Ecosystem API URL}}SystemInterface)
      EXISTING_INTERFACE: "MQ_SAP_GDW_SIT"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # TC-1: update the version of an existing System Interface (expect success)
      - name: "TC-1 Update existing System Interface version"
        id: tc1
        continue-on-error: true
        uses: ./
        with:
          enov8_url: ${{ secrets.ENOV8_BASE_URL }}
          app_id: ${{ secrets.ENOV8_APP_ID }}
          app_key: ${{ secrets.ENOV8_APP_KEY }}
          resourceType: "System Interface"
          resourceName: "${{ env.EXISTING_INTERFACE }}"
          version: "9.9.${{ github.run_number }}"

      # TC-2: create a new System Interface (expect success, but NOT linked to any Systems)
      - name: "TC-2 Create new System Interface"
        id: tc2
        continue-on-error: true
        uses: ./
        with:
          enov8_url: ${{ secrets.ENOV8_BASE_URL }}
          app_id: ${{ secrets.ENOV8_APP_ID }}
          app_key: ${{ secrets.ENOV8_APP_KEY }}
          resourceType: "System Interface"
          resourceName: "E2E-Interface-${{ env.RUN }}"
          version: "1.0.0"
          autocreate: true
          metadata: '{}'

      # TC-3: update an interface that does not exist, autocreate off (expect failure)
      - name: "TC-3 Missing interface without autocreate"
        id: tc3
        continue-on-error: true
        uses: ./
        with:
          enov8_url: ${{ secrets.ENOV8_BASE_URL }}
          app_id: ${{ secrets.ENOV8_APP_ID }}
          app_key: ${{ secrets.ENOV8_APP_KEY }}
          resourceType: "System Interface"
          resourceName: "E2E-NoSuchInterface-${{ env.RUN }}"
          version: "1.0.0"

      - name: Summarize results
        if: always()
        run: |
          echo "## System Interface tests (run ${RUN}, GitHub user ${GITHUB_TRIGGERING_ACTOR})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Case | Expected | Actual | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          overall=0
          while IFS='|' read -r label expected actual; do
            if [ "$expected" = "$actual" ]; then mark="✅ PASS"; else mark="❌ FAIL"; overall=1; fi
            echo "| ${label} | ${expected} | ${actual} | ${mark} |" >> "$GITHUB_STEP_SUMMARY"
          done <<EOT
          TC-1 Update existing System Interface version|success|${{ steps.tc1.outcome }}
          TC-2 Create new System Interface|success|${{ steps.tc2.outcome }}
          TC-3 Missing interface without autocreate|failure|${{ steps.tc3.outcome }}
          EOT
          exit $overall
